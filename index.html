/* ---- motion ---- */
:root{--ease:cubic-bezier(.16,1,.3,1)}
#app.enter>*{animation:enter .55s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}
#home .logo,.shop>.logo{animation:pop .9s var(--ease) both}
@keyframes pop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:none}}
.menu a{animation:enter .6s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms + 350ms);transition:transform .25s var(--ease),color .2s}
.menu a:hover{transform:translateX(8px);color:var(--red);text-decoration:none}
.strip a{animation:deal .9s var(--ease) both;animation-delay:calc(var(--i,0) * 65ms + 250ms);transition:flex .55s var(--ease),filter .3s}
@keyframes deal{from{opacity:0;transform:translateY(80px) scaleY(.85)}}
.strip:hover a{filter:grayscale(.6) brightness(.8)}
.strip a:hover{filter:none}
.strip img{transition:transform .8s var(--ease)}
.strip a:hover img{transform:scale(1.07)}
.caption{width:700px;max-width:100%;margin-top:18px;min-height:3em;display:flex;gap:14px}
.caption b{font:italic 800 18px/1.2 var(--disp);white-space:nowrap}
.caption span{color:var(--mute)}
.caption.swap{animation:enter .35s var(--ease)}
#main{animation:wipe 1s var(--ease) both}
@keyframes wipe{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.item .img img,.item .tile{transition:transform .7s var(--ease)}
.item:hover .img img,.item:hover .tile{transform:scale(1.05)}
.btn{transition:transform .2s var(--ease),opacity .2s}
.btn:hover{transform:translateY(-2px)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:calc(var(--i,0) * 50ms)}
.rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
